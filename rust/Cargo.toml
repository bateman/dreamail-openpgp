[package]
name = "mishmail-rpgp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false
description = "C ABI over rPGP for MishMail: verify, decrypt and inspect keys (step 4B, scope B)"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
# Exact version; Cargo.lock (committed, used with --locked) pins every
# transitive crate by version and SHA-256.
pgp = { version = "=0.21.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[profile.release]
# No LTO: with it the static library's objects are LLVM bitcode from Rust's
# LLVM, which Xcode's older LLVM cannot read (nm and the linker fail with
# "Unknown attribute kind"). The app's own link removes unused code.
lto = false
codegen-units = 1
# Debug information only: the exported C symbols must stay in the archive.
strip = "debuginfo"
opt-level = "s"

[dev-dependencies]
# Same versions rPGP itself uses; only for generating throwaway keys in tests.
rand = "0.8.6"
smallvec = "1.10.0"

# Tests generate RSA keys: optimise dependencies in debug builds so that
# takes seconds, not minutes. Release builds are unaffected.
[profile.dev.package."*"]
opt-level = 2

# rPGP with release arithmetic in tests, so that they check what ships.
# rPGP 0.21.1 computes `nonce_size() - 8` for a SEIPD v2 header's AEAD
# octet before checking it: an unknown value underflows. With overflow
# checks (debug) that panics; in release it wraps, the bounds check after
# it fails, and decryption reports an AEAD error. The tests cover that path.
[profile.dev.package.pgp]
overflow-checks = false

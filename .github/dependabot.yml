# Version updates for the Rust crates and the pinned GitHub Actions. Each
# update is a pull request that runs CI (tests, clippy, licences, advisories);
# nothing merges by itself.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # rPGP is upgraded by the Upgrade rPGP workflow, which also updates
      # the README pins and the licence file (README, "Upgrading rPGP").
      - dependency-name: pgp
      # Test-only crates that must stay on the versions rPGP itself uses
      # (its key generation takes a rand 0.8 generator). Revisit when the
      # pgp crate is upgraded.
      - dependency-name: rand
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: smallvec
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

name: Release

# Builds the xcframework twice in separate directories, refuses to publish
# unless both zips are identical, then creates the GitHub release v<version>
# with the zip and its SHA-256. A last job opens the pull request that
# points Package.swift at that release and merges it once CI passes, without
# review (owner's decision; README, "Releasing").
#
# Runs by hand, or by itself when an rPGP upgrade pull request (branch
# deps/rpgp-*) is merged into main by a person; the Upgrade rPGP workflow
# dispatches it after merging one itself, since a merge made with
# GITHUB_TOKEN triggers no workflow. With
# no version given, the version is the latest release tag with the patch
# number raised by one.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (empty: latest tag, next patch)"
        required: false
        default: ""
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Picks the version and the commit, on a cheap runner. Nothing is
  # released if that commit already carries a release tag.
  prepare:
    name: Choose the version
    # By hand from main only, or a merged rPGP upgrade from this repository
    # (never a fork).
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event.pull_request.merged &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'deps/rpgp-'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit on main for a merged pull request; the
          # dispatched ref otherwise.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Choose and check the version
        id: version
        env:
          VERSION: ${{ inputs.version }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          sha=$(git rev-parse HEAD)
          # Only what is on main is released: never a commit from elsewhere.
          if ! git merge-base --is-ancestor "$sha" "origin/$BASE"; then
            echo "$sha is not on $BASE: not releasing." >&2
            exit 1
          fi
          tagged=$(git tag --points-at HEAD -l 'v[0-9]*')
          if [ -n "$tagged" ]; then
            echo "$sha is already released as $tagged: nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$VERSION" ]; then
            last=$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
            if [ -z "$last" ]; then
              echo "No release tag to start from: give a version." >&2
              exit 1
            fi
            IFS=. read -r major minor patch <<< "${last#v}"
            VERSION="$major.$minor.$((patch + 1))"
            echo "Latest release $last, releasing $VERSION."
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be MAJOR.MINOR.PATCH, got '$VERSION'." >&2
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "sha=$sha"
          } >> "$GITHUB_OUTPUT"

  # Builds with a read-only token: crate build scripts and proc macros run
  # here, so this job can publish nothing. The zip goes to the next job as
  # an artifact, with its checksum as an output.
  build:
    name: Build twice and compare
    needs: prepare
    if: needs.prepare.outputs.version != ''
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      checksum: ${{ steps.compare.outputs.checksum }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
          # SOURCE_DATE_EPOCH comes from the last commit touching rust/.
          fetch-depth: 0

      - name: Install the pinned Rust toolchain
        working-directory: rust
        run: rustup toolchain install

      # Crates are downloaded once against Cargo.lock; the builds below run
      # with --offline (inside the build script).
      - name: Fetch the locked crates
        working-directory: rust
        run: cargo fetch --locked

      - name: Check third-party licences
        run: python3 scripts/third_party_licenses.py --check

      - name: Check advisories
        working-directory: rust
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny --manifest-path Cargo.toml check advisories

      - name: Build twice and compare
        id: compare
        run: |
          scripts/build-xcframework.sh "$RUNNER_TEMP/a"
          rm -rf rust/target
          scripts/build-xcframework.sh "$RUNNER_TEMP/b"
          if ! cmp "$RUNNER_TEMP/a/DreaMailRPGP.xcframework.zip" "$RUNNER_TEMP/b/DreaMailRPGP.xcframework.zip"; then
            echo "The two builds differ: not reproducible, not publishing." >&2
            exit 1
          fi
          {
            echo "### DreaMailRPGP.xcframework.zip"
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "$RUNNER_TEMP/a/DreaMailRPGP.xcframework.zip.sha256")\`"
            echo
            echo "Size: $(du -h "$RUNNER_TEMP/a/DreaMailRPGP.xcframework.zip" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "checksum=$(cut -d' ' -f1 "$RUNNER_TEMP/a/DreaMailRPGP.xcframework.zip.sha256")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xcframework
          path: ${{ runner.temp }}/a/DreaMailRPGP.xcframework.zip
          if-no-files-found: error
          retention-days: 1

  # Publishes what build made, after checking it against build's checksum.
  # Runs no cargo: the write token never meets crate code.
  release:
    name: Publish the release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # create the release
    outputs:
      version: ${{ needs.prepare.outputs.version }}
      checksum: ${{ needs.build.outputs.checksum }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: xcframework
          path: ${{ runner.temp }}/a

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          CHECKSUM: ${{ needs.build.outputs.checksum }}
        run: |
          cd "$RUNNER_TEMP/a"
          sha256sum DreaMailRPGP.xcframework.zip > DreaMailRPGP.xcframework.zip.sha256
          sum=$(cut -d' ' -f1 DreaMailRPGP.xcframework.zip.sha256)
          if [ "$sum" != "$CHECKSUM" ]; then
            echo "The artifact's SHA-256 $sum is not the build's $CHECKSUM: not publishing." >&2
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          commit=$(git rev-parse HEAD)
          gh release create "v$VERSION" \
            "$RUNNER_TEMP/a/DreaMailRPGP.xcframework.zip" \
            "$RUNNER_TEMP/a/DreaMailRPGP.xcframework.zip.sha256" \
            THIRD_PARTY_LICENSES.md \
            --target "$commit" --title "v$VERSION" \
            --notes "DreaMailRPGP.xcframework.zip SHA-256: $sum (binaryTarget checksum). Built from $commit."

  # Opens the pull request that points Package.swift at the new release,
  # after checking the published zip against the checksum, and merges it
  # once CI passes on the branch (scripts/merge_when_green.sh).
  package:
    name: Pull request for Package.swift
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write       # push release/package-v<version>, merge
      pull-requests: write  # open and merge the pull request
      actions: write        # dispatch CI on the branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check the published zip
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
          CHECKSUM: ${{ needs.release.outputs.checksum }}
        run: |
          gh release download "v$VERSION" --pattern DreaMailRPGP.xcframework.zip --dir "$RUNNER_TEMP"
          echo "$CHECKSUM  $RUNNER_TEMP/DreaMailRPGP.xcframework.zip" | sha256sum --check

      - name: Update Package.swift, open the pull request, merge when green
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.release.outputs.version }}
          CHECKSUM: ${{ needs.release.outputs.checksum }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          branch="release/package-v$VERSION"
          sed -i -E \
            -e "s/^let version = \"[^\"]*\"$/let version = \"$VERSION\"/" \
            -e "s/^let checksum = \"[0-9a-f]{64}\"$/let checksum = \"$CHECKSUM\"/" \
            Package.swift
          grep -qx "let version = \"$VERSION\"" Package.swift
          grep -qx "let checksum = \"$CHECKSUM\"" Package.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null commit -q -am "Point Package.swift at release v$VERSION"
          sha=$(git rev-parse HEAD)
          gh auth setup-git
          # The branch is the bot's own: a re-run replaces it and reuses its
          # pull request, if one is open.
          git push -q --force origin "HEAD:refs/heads/$branch"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "Reusing the open pull request for $branch."
          else
            gh pr create --base "$BASE" --head "$branch" \
            --title "Point Package.swift at release v$VERSION" \
            --body "Sets \`version\` and \`checksum\` in Package.swift to release [v$VERSION]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/v$VERSION). The published zip was downloaded and checked against the checksum.

          Cross-check (README, \"Releasing\"): a local \`scripts/build-xcframework.sh\` on another Mac should give the same SHA-256. Once merged, DreaMail pins the merge commit in \`project.yml\`.

          Opened by the Release workflow ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID), which merges it once CI passes."
          fi
          scripts/merge_when_green.sh "$branch" "$sha"

name: Release

# Manual only. Builds the xcframework twice in separate directories, refuses
# to publish unless both zips are identical, then creates the GitHub release
# v<version> with the zip and its SHA-256. Package.swift is updated to that
# release in a separate, reviewed commit (README, "Releasing").
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (tag v<version>)"
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 45
    # Only this job may write, and only repository contents (the release).
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # SOURCE_DATE_EPOCH comes from the last commit touching rust/.
          fetch-depth: 0

      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be MAJOR.MINOR.PATCH, got '$VERSION'." >&2
            exit 1
          fi

      - name: Install the pinned Rust toolchain
        working-directory: rust
        run: rustup toolchain install

      # Crates are downloaded once against Cargo.lock; the builds below run
      # with --offline (inside the build script).
      - name: Fetch the locked crates
        working-directory: rust
        run: cargo fetch --locked

      - name: Check third-party licences
        run: python3 scripts/third_party_licenses.py --check

      - name: Check advisories
        working-directory: rust
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny --manifest-path Cargo.toml check advisories

      - name: Build twice and compare
        run: |
          scripts/build-xcframework.sh "$RUNNER_TEMP/a"
          rm -rf rust/target
          scripts/build-xcframework.sh "$RUNNER_TEMP/b"
          if ! cmp "$RUNNER_TEMP/a/MishMailRPGP.xcframework.zip" "$RUNNER_TEMP/b/MishMailRPGP.xcframework.zip"; then
            echo "The two builds differ: not reproducible, not publishing." >&2
            exit 1
          fi
          {
            echo "### MishMailRPGP.xcframework.zip"
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 "$RUNNER_TEMP/a/MishMailRPGP.xcframework.zip.sha256")\`"
            echo
            echo "Size: $(du -h "$RUNNER_TEMP/a/MishMailRPGP.xcframework.zip" | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          sum=$(cut -d' ' -f1 "$RUNNER_TEMP/a/MishMailRPGP.xcframework.zip.sha256")
          gh release create "v$VERSION" \
            "$RUNNER_TEMP/a/MishMailRPGP.xcframework.zip" \
            "$RUNNER_TEMP/a/MishMailRPGP.xcframework.zip.sha256" \
            THIRD_PARTY_LICENSES.md \
            --target "$GITHUB_SHA" --title "v$VERSION" \
            --notes "MishMailRPGP.xcframework.zip SHA-256: $sum (binaryTarget checksum). Built from $GITHUB_SHA."

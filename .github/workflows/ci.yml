name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: read-only token for every job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Engine tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The compiler comes from rust-toolchain.toml; the runner image ships rustup.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # Every crate is downloaded once, checked against Cargo.lock; the
      # build and tests then run offline.
      - name: Fetch the locked crates
        run: cargo fetch --locked

      # The GnuPG interoperability tests need gpg 2.4 (the version that
      # sends OCB packets by default). It comes with the runner image;
      # nothing is installed. The tests fail, not skip, without it.
      - name: Check GnuPG for the interoperability tests
        run: |
          gpg --version > "$RUNNER_TEMP/gpg-version"
          cat "$RUNNER_TEMP/gpg-version"
          grep -qE '^gpg \(GnuPG\) 2\.4\.' "$RUNNER_TEMP/gpg-version"

      - name: Test
        run: cargo test --locked --offline

      - name: Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings

      # THIRD_PARTY_LICENSES.md must match Cargo.lock, and every linked crate
      # must have a licence text (or be acknowledged in licenses/README.md).
      - name: Check third-party licences
        run: python3 ../scripts/third_party_licenses.py --check

      # Known vulnerabilities in the locked crates (RustSec advisory
      # database). cargo-deny is pinned to an exact version and built from
      # crates.io with its own lock file; exceptions live in deny.toml, each
      # with its reason.
      - name: Check advisories
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny --manifest-path Cargo.toml check advisories

      - name: Shellcheck the build script
        run: shellcheck ../scripts/build-xcframework.sh

  # The release builds this on macOS; build it here too, twice, so a break in
  # the build script or a build that is not reproducible shows on the pull
  # request and not at release time. Nothing is published.
  xcframework:
    name: xcframework build (macOS)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # SOURCE_DATE_EPOCH comes from the last commit touching rust/.
          fetch-depth: 0

      - name: Install the pinned Rust toolchain
        working-directory: rust
        run: rustup toolchain install

      - name: Build twice and compare
        run: |
          scripts/build-xcframework.sh "$RUNNER_TEMP/a"
          rm -rf rust/target
          scripts/build-xcframework.sh "$RUNNER_TEMP/b"
          if ! cmp "$RUNNER_TEMP/a/MishMailRPGP.xcframework.zip" "$RUNNER_TEMP/b/MishMailRPGP.xcframework.zip"; then
            echo "The two builds differ: not reproducible." >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/a/MishMailRPGP.xcframework.zip.sha256"

      # The library must link with Apple's linker for both architectures and
      # answer a call. The runner is arm64, so only that binary is run.
      - name: Link and call the library
        run: |
          lib="$RUNNER_TEMP/a/universal/libmishmail_rpgp.a"
          for arch in arm64 x86_64; do
            clang -arch "$arch" -mmacosx-version-min=14.0 -Wall -Werror \
              -I rust/include scripts/smoke/link_check.c "$lib" \
              -o "$RUNNER_TEMP/link_check_$arch"
          done
          "$RUNNER_TEMP/link_check_arm64"

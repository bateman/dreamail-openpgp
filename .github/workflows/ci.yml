name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: read-only token for every job.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Engine tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The compiler comes from rust-toolchain.toml; the runner image ships rustup.
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # Every crate is downloaded once, checked against Cargo.lock; the
      # build and tests then run offline.
      - name: Fetch the locked crates
        run: cargo fetch --locked

      - name: Test
        run: cargo test --locked --offline

      - name: Clippy
        run: cargo clippy --locked --offline --all-targets -- -D warnings

      # THIRD_PARTY_LICENSES.md must match Cargo.lock, and every linked crate
      # must have a licence text (or be acknowledged in licenses/README.md).
      - name: Check third-party licences
        run: python3 ../scripts/third_party_licenses.py --check

      # Known vulnerabilities in the locked crates (RustSec advisory
      # database). cargo-deny is pinned to an exact version and built from
      # crates.io with its own lock file; exceptions live in deny.toml, each
      # with its reason.
      - name: Check advisories
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny --manifest-path Cargo.toml check advisories

      - name: Shellcheck the build script
        run: shellcheck ../scripts/build-xcframework.sh

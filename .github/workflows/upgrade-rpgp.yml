name: Upgrade rPGP

# Weekly, or by hand: if crates.io has a newer stable rPGP (or the version
# given), upgrades the `pgp` pin with scripts/upgrade_rpgp.py and opens the
# pull request deps/rpgp-<version>, whose body is the script's report.
#
# Three jobs, so that crate code never runs where a write token exists:
#   check    read-only, no crate code: is there a version to take, and no
#            pull request for it yet? With no version given, a release
#            younger than 7 days waits for next week's run.
#   test     read-only: the script with every check (tests, clippy,
#            licences, advisories, crate age and new crate names). This is
#            where build scripts and proc macros of the new crates run.
#   publish  write token, clean checkout of main: the script with
#            --no-checks (cargo update, fetch and metadata only: no build
#            script runs), then only rust/Cargo.toml, rust/Cargo.lock,
#            README.md and THIRD_PARTY_LICENSES.md may differ. It pushes the
#            branch and opens the pull request.
#
# If every check passed, publish waits for CI on the branch, merges the pull
# request without review (owner's decision) and dispatches the Release
# workflow. Otherwise the pull request is a draft, left for a person; merging
# it then starts the release (README, "Upgrading rPGP").
#
# Pull requests opened with GITHUB_TOKEN do not trigger the CI workflow, and
# a merge made with it triggers no workflow: scripts/merge_when_green.sh
# dispatches CI, and publish dispatches the release. Needs "Allow GitHub
# Actions to create and approve pull requests" (Settings, Actions, General).
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "rPGP version, e.g. 0.22.0 (empty: newest stable on crates.io)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: upgrade-rpgp
  cancel-in-progress: false

jobs:
  check:
    name: Look for a new release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # is a pull request for it open already?
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Exit 2 (crates.io unreachable, a downgrade, no such version...) fails
      # the job: an error never reads as "up to date".
      - name: Check crates.io and open pull requests
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            version=$(python3 scripts/upgrade_rpgp.py "$VERSION" --check)
          else
            version=$(python3 scripts/upgrade_rpgp.py --check)
          fi
          if [ -z "$version" ]; then
            echo "rPGP is up to date, or the newest release is still in its cooldown." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="deps/rpgp-$version"
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $branch is already open: nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/heads/$branch" > /dev/null; then
            echo "Branch $branch exists with no open pull request: delete it or open one, then run again." | tee -a "$GITHUB_STEP_SUMMARY" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Upgrading to $version." | tee -a "$GITHUB_STEP_SUMMARY"

  test:
    name: Upgrade and run every check (read-only)
    needs: check
    if: needs.check.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      passed: ${{ steps.upgrade.outputs.passed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        working-directory: rust
        run: rustup toolchain install

      - name: Check GnuPG for the interoperability tests
        run: |
          gpg --version > "$RUNNER_TEMP/gpg-version"
          cat "$RUNNER_TEMP/gpg-version"
          grep -qE '^gpg \(GnuPG\) 2\.4\.' "$RUNNER_TEMP/gpg-version"

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked --version 0.20.2

      # Exit 0: every check passed; 1: a check failed (draft pull request);
      # 2: could not upgrade (the job fails).
      - name: Upgrade and check
        id: upgrade
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          status=0
          python3 scripts/upgrade_rpgp.py "$VERSION" || status=$?
          if [ "$status" -ge 2 ]; then
            exit "$status"
          fi
          cat "build/rpgp-upgrade-$VERSION.md" >> "$GITHUB_STEP_SUMMARY"
          echo "passed=$([ "$status" -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  publish:
    name: Open the pull request, merge when green
    needs: [check, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: write       # push deps/rpgp-<version>, merge
      pull-requests: write  # open and merge the pull request
      actions: write        # dispatch CI and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        working-directory: rust
        run: rustup toolchain install

      # cargo update, fetch and metadata: no build script or proc macro runs.
      - name: Update the pin, lockfile, licences and README
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: python3 scripts/upgrade_rpgp.py "$VERSION" --no-checks

      - name: Push the branch and open the pull request, merge when green
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
          PASSED: ${{ needs.test.outputs.passed }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          branch="deps/rpgp-$VERSION"
          report="build/rpgp-upgrade-$VERSION.md"
          allowed=$'README.md\nTHIRD_PARTY_LICENSES.md\nrust/Cargo.lock\nrust/Cargo.toml'
          changed=$(git status --porcelain --untracked-files=all | cut -c4-)
          if [ -n "$(grep -vxF "$allowed" <<< "$changed" || true)" ]; then
            echo "Unexpected changes, not publishing:" >&2
            echo "$changed" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md THIRD_PARTY_LICENSES.md rust/Cargo.lock rust/Cargo.toml
          git -c core.hooksPath=/dev/null commit -q -m "Upgrade rPGP to $VERSION" \
            -m "Made by the Upgrade rPGP workflow (scripts/upgrade_rpgp.py)."
          sha=$(git rev-parse HEAD)
          gh auth setup-git
          git push -q origin "HEAD:refs/heads/$branch"

          checks="every check passed"
          if [ "$PASSED" != "true" ]; then
            checks="**a check failed**: draft, left for a person"
          fi
          {
            echo
            echo "---"
            echo "Checks ran in the read-only test job ($checks): $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Opened by the Upgrade rPGP workflow; CI is dispatched on this branch."
          } >> "$report"
          if [ "$PASSED" != "true" ]; then
            gh pr create --base "$BASE" --head "$branch" --draft \
              --title "Upgrade rPGP to $VERSION" --body-file "$report"
            gh workflow run ci.yml --ref "$branch"
            echo "A check failed: draft pull request, left for a person." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh pr create --base "$BASE" --head "$branch" \
            --title "Upgrade rPGP to $VERSION" --body-file "$report"
          scripts/merge_when_green.sh "$branch" "$sha"
          gh workflow run release.yml --ref "$BASE"
          echo "Merged and released: see the Release workflow." >> "$GITHUB_STEP_SUMMARY"
